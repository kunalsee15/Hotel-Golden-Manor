<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hotel Golden Manor — Menus & Directory</title>
<meta name="description" content="Access the Hotel Golden Manor restaurant menu, bar menu and guest directory instantly." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   EDIT HERE — put your PDF file names / links below
   Place the PDFs next to this HTML file, or paste full URLs.
   ============================================================ */
:root{
  --pdf-hint:"restaurant-menu.pdf, bar-menu.pdf, directory.pdf";

  /* Colours */
  --cream:#fdf3dd;
  --paper:#ffffff;
  --ink:#1b1b1b;
  --gold:#c8a04a;
  --gold-soft:#e2c67e;
  --muted-text:#9a8558;

  /* Card background photos (swap with your own) */
  --img-restaurant:url("https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=1200&q=70");
  --img-bar:url("https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?auto=format&fit=crop&w=1200&q=70");
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Inter",system-ui,sans-serif;
  background:var(--cream);
  color:var(--ink);
  display:flex;
  justify-content:center;
  padding:0;
}
.sheet{
  width:100%;
  max-width:600px;
  background:var(--cream);
  min-height:100%;
}
.panel{
  background:var(--paper);
  padding:0 26px 26px;
  margin-top:64px;
}

/* Logo */
.logo{
  width:96px;height:150px;margin:0 auto;
  transform:translateY(-58px);
  background:var(--paper);
  display:flex;align-items:center;justify-content:center;
  margin-bottom:-46px;
}
.logo img,.logo svg{width:78px;height:107px;object-fit:contain;display:block}

/* Header */
h1{
  font-family:"Playfair Display",Georgia,serif;
  font-size:clamp(30px,7.5vw,44px);
  font-weight:900;
  text-align:center;
  letter-spacing:-.5px;
  margin-bottom:18px;
}
.contact{text-align:center;color:var(--muted-text);font-size:14px;line-height:1.9;font-weight:600}
.contact a{color:inherit;text-decoration:none}
.tagline{
  text-align:center;color:var(--gold);font-weight:700;font-size:14px;
  margin:10px 0 22px;
}

/* Cards */
.card{
  position:relative;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  border-radius:14px;border:2px solid #2a2118;
  overflow:hidden;text-decoration:none;
  box-shadow:0 6px 18px rgba(0,0,0,.14);
  transition:transform .18s ease, box-shadow .18s ease;
}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(0,0,0,.22)}
.card::before{
  content:"";position:absolute;inset:0;
  background-size:cover;background-position:center;
  background-image:var(--bg);
}
.card::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.42)}
.card > *{position:relative;z-index:1}
.card svg{width:44px;height:44px;margin-bottom:8px}
.card span{
  font-family:"Playfair Display",Georgia,serif;
  font-size:34px;font-weight:900;color:var(--gold-soft);
  text-align:center;line-height:1.1;
  text-shadow:0 2px 6px rgba(0,0,0,.5);
}

.card-wide{--bg:var(--img-restaurant);height:190px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card-bar{--bg:var(--img-bar);height:200px}
.card-bar span{font-size:30px}

.card-plain{
  height:200px;background:var(--paper);
}
.card-plain::before,.card-plain::after{display:none}
.card-plain span{color:var(--ink);font-size:30px;text-shadow:none}
.card-plain svg{color:var(--gold)}

.scan{text-align:center;color:var(--gold);font-weight:700;font-size:14px;margin-top:22px}

.address{
  text-align:center;font-weight:700;font-size:15px;line-height:1.6;
  padding:26px 34px;color:var(--ink);
}
.footer-bar{height:34px;background:var(--cream)}

@media (max-width:400px){
  .grid{grid-template-columns:1fr}
  .card-plain,.card-bar{height:160px}
}
</style>
</head>
<body>
<div class="sheet">
  <div class="panel">
    <div class="logo">
      <!-- LOGO SPACE: drop your file here, e.g. -->
      <!-- <img src="logo.png" alt="Hotel Golden Manor logo"> -->
    </div>

    <h1>Hotel Golden Manor</h1>

    <p class="contact">
      <a href="tel:+919828330987">+91 98283 30987</a> | <a href="tel:+919950553069">+91 99505 53069</a><br>
      <a href="mailto:resveration@goldenmanorjaipur.com">resveration@goldenmanorjaipur.com</a>
    </p>
    <p class="tagline">Access our documents instantly</p>

    <!-- ===== PDF LINK 1 ===== -->
    <a class="card card-wide" href="restaurant-menu.pdf" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="#e2c67e" stroke-width="2" stroke-linecap="round">
        <path d="M4 3v7a3 3 0 0 0 6 0V3M7 10v11"/><path d="M17 3c-2 2-2 6-2 8h4V3z"/><path d="M17 11v10"/>
      </svg>
      <span>Restaurant Menu</span>
    </a>

    <div class="grid">
      <!-- ===== PDF LINK 2 ===== -->
      <a class="card card-bar" href="bar-menu.pdf" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="#e2c67e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 4h18l-9 9z"/><path d="M12 13v7"/><path d="M8 21h8"/>
        </svg>
        <span>Bar<br>Menu</span>
      </a>

      <!-- ===== PDF LINK 3 ===== -->
      <a class="card card-plain" href="directory.pdf" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 5h7a2 2 0 0 1 2 2v13a2 2 0 0 0-2-2H3z"/><path d="M21 5h-7a2 2 0 0 0-2 2v13a2 2 0 0 1 2-2h7z"/>
        </svg>
        <span>Directory</span>
      </a>
    </div>

    <p class="scan">Scan anytime for the latest updates</p>
  </div>

  <p class="address">B-22/B-1,2 Shiv Marg, Collectorate Circle, Banipark, Jaipur-302016</p>
  <div class="footer-bar"></div>
</div>
</body>
</html>
