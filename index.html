<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hotel Golden Manor Documents</title>

  <!--
  ═══════════════════════════════════════════════════════════════════
  HOTEL GOLDEN MANOR — QUICK SETUP GUIDE
  ═══════════════════════════════════════════════════════════════════

  1. PDF LINKS
     Search for "PDF LINKS" below and update the three href values.

  2. COVER PHOTOS
     Drop your images into the assets/ folder, then update the two
     --restaurant-cover and --bar-cover variables in the :root block.

     Recommended size: 800 × 500 px (JPG or PNG).

  3. LOGO (optional)
     Replace assets/logo.png or keep the built-in SVG logo.

  4. CONTACT DETAILS
     Search for "CONTACT INFO" in the HTML body section.
  ═══════════════════════════════════════════════════════════════════
  -->

  <style>
    :root {
      /* ── COLORS ── */
      --page-bg: #fff4d8;
      --panel-bg: #ffffff;
      --gold: #9b813b;
      --deep-brown: #2a1f18;
      --shadow: 0 18px 28px rgba(56, 42, 28, 0.16);
      --tile-shadow: 0 8px 18px rgba(56, 42, 28, 0.14);

      /* ── COVER PHOTOS — change these paths to your own images ── */
      --restaurant-cover: url("restaurant-cover.jpg");
      --bar-cover: url("bar-cover.jpg");

      /* ── TILE HEIGHTS (mobile first) ── */
      --restaurant-height: 150px;
      --menu-tile-height: 155px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--page-bg);
      font-family: Arial, Helvetica, sans-serif;
      color: #000;
    }

    body {
      display: flex;
      justify-content: center;
    }

    /* ── PAGE SHELL ── */
    .poster {
      width: 100%;
      max-width: 600px;
      min-height: 100vh;
      background: var(--page-bg);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .main-card {
      width: calc(100% - 32px);
      max-width: 546px;
      margin: 48px auto 0;
      background: var(--panel-bg);
      text-align: center;
      padding: 48px 20px 32px;
      box-shadow: var(--shadow);
      border-radius: 4px;
    }

    /* ── LOGO ── */
    .logo {
      width: 72px;
      height: auto;
      display: block;
      margin: 0 auto 20px;
    }

    /* ── TYPOGRAPHY ── */
    h1 {
      margin: 0 0 18px;
      font-size: clamp(28px, 7vw, 44px);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.02em;
    }

    .contact {
      margin: 0;
      color: var(--gold);
      font-size: clamp(13px, 3.4vw, 16px);
      line-height: 1.65;
    }

    .contact a {
      color: inherit;
      text-decoration: none;
    }

    .contact a:hover,
    .contact a:focus-visible {
      text-decoration: underline;
    }

    .contact-note {
      display: block;
      margin-top: 6px;
    }

    /* ── DOCUMENT GRID (mobile first: stack, then 2-col) ── */
    .document-grid {
      margin-top: 22px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      min-width: 0;
    }

    .document-grid a {
      text-decoration: none;
      color: inherit;
    }

    .restaurant-tile,
    .bar-tile,
    .directory-tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-width: 0;
      width: 100%;
      border-radius: 8px;
      text-decoration: none;
      overflow: hidden;
      position: relative;
      box-shadow: var(--tile-shadow);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .restaurant-tile:hover,
    .bar-tile:hover,
    .directory-tile:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(56, 42, 28, 0.2);
    }

    .restaurant-tile:focus-visible,
    .bar-tile:focus-visible,
    .directory-tile:focus-visible {
      outline: 4px solid rgba(155, 129, 59, 0.45);
      outline-offset: 4px;
    }

    /* Cover-photo tiles */
    .restaurant-tile,
    .bar-tile {
      background-repeat: no-repeat;
      background-position: center;
      background-size: cover;
    }

    .restaurant-tile {
      background-color: #2a2218;
      background-image: var(--restaurant-cover);
      min-height: var(--restaurant-height);
    }

    .bar-tile {
      background-color: #1a2830;
      background-image: var(--bar-cover);
      min-height: var(--menu-tile-height);
    }

    .tile__overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(20, 14, 10, 0.15) 0%,
        rgba(20, 14, 10, 0.55) 100%
      );
      pointer-events: none;
    }

    .tile__content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px;
      width: 100%;
      height: 100%;
    }

    .tile__icon {
      width: 44px;
      height: 44px;
      color: var(--gold);
      flex-shrink: 0;
    }

    .tile__label {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(22px, 5.5vw, 30px);
      font-weight: 700;
      line-height: 1.15;
      text-align: center;
      color: var(--gold);
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
      text-decoration: none;
    }

    /* Directory tile */
    .directory-tile {
      background: var(--panel-bg);
      border: 3px solid var(--deep-brown);
      color: var(--deep-brown);
      min-height: var(--menu-tile-height);
    }

    .directory-tile .tile__icon {
      color: var(--gold);
    }

    .directory-tile .tile__label {
      color: var(--deep-brown);
      text-shadow: none;
    }

    .update-note {
      margin: 22px 0 0;
      color: var(--gold);
      font-size: clamp(13px, 3.4vw, 16px);
    }

    /* ── ADDRESS ── */
    .address-band {
      width: calc(100% - 32px);
      max-width: 546px;
      margin: 28px auto 32px;
      padding: 0 16px;
      text-align: center;
      color: var(--gold);
      font-size: clamp(12px, 3.2vw, 15px);
      line-height: 1.55;
    }

    /* ── TABLET / LARGER PHONES: bar + directory side by side ── */
    @media (min-width: 400px) {
      :root {
        --restaurant-height: 170px;
        --menu-tile-height: 165px;
      }

      .main-card {
        margin-top: 64px;
        padding: 64px 28px 36px;
      }

      .document-grid {
        grid-template-columns: 1fr 1fr;
        gap: 18px;
      }

      .restaurant-tile {
        grid-column: 1 / -1;
      }
    }

    /* ── DESKTOP POSTER SIZE ── */
    @media (min-width: 640px) {
      :root {
        --restaurant-height: 188px;
        --menu-tile-height: 199px;
      }

      .main-card {
        margin-top: 80px;
        padding: 72px 36px 40px;
      }

      .logo {
        width: 88px;
      }

      .document-grid {
        gap: 22px;
      }
    }
  </style>
</head>
<body>
  <main class="poster" aria-label="Hotel Golden Manor document access">
    <section class="main-card">
      <!-- LOGO: swap src with your own PNG/SVG if needed -->
      <img
        class="logo"
        src="logo.png"
        alt="Hotel Golden Manor logo"
        width="88"
        height="88"
        onerror="this.replaceWith(document.getElementById('logo-fallback').content.cloneNode(true))"
      />

      <template id="logo-fallback">
        <svg class="logo" viewBox="0 0 100 100" fill="none" aria-label="Hotel Golden Manor logo" role="img">
          <path d="M50 6  L68 30  L62 30  L50 14  L38 30  L32 30  Z" fill="#111"/>
          <path d="M50 22 L72 52  L66 52  L50 34  L34 52  L28 52  Z" fill="#111"/>
          <path d="M50 40 L76 76  L70 76  L50 54  L30 76  L24 76  Z" fill="#111"/>
          <path d="M50 58 L80 98  L74 98  L50 72  L26 98  L20 98  Z" fill="#111"/>
        </svg>
      </template>

      <h1>Hotel Golden Manor</h1>

      <!-- CONTACT INFO — edit phone numbers and email below -->
      <p class="contact">
        <a href="tel:+919828330987">+91 98283 30987</a>
        &nbsp;|&nbsp;
        <a href="tel:+919950553069">+91 99505 53069</a><br />
        <a href="mailto:reservation@goldenmanorjaipur.com">reservation@goldenmanorjaipur.com</a>
        <span class="contact-note">Access our documents instantly</span>
      </p>

      <div class="document-grid" aria-label="Hotel documents">

        <!-- PDF LINKS — Restaurant Menu -->
        <a
          class="restaurant-tile"
          href="Restaurant Menu_compressed.pdf"
          target="_blank"
          rel="noopener"
          aria-label="Open Restaurant Menu PDF"
        >
          <span class="tile__overlay" aria-hidden="true"></span>
          <span class="tile__content">
            <svg class="tile__icon" viewBox="0 0 64 64" fill="none" aria-hidden="true">
              <path d="M22 10v22c0 4 2 6 6 6s6-2 6-6V10" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
              <path d="M28 10v8M25 14h6" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
              <path d="M42 10v44" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
              <path d="M42 10c6 0 8 4 8 10v8c0 4-2 6-6 6" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
            </svg>
            <span class="tile__label">Restaurant Menu</span>
          </span>
        </a>

        <!-- PDF LINKS — Bar Menu -->
        <a
          class="bar-tile" 
          href="Bar Menu.pdf"
          target="_blank"
          rel="noopener"
          aria-label="Open Bar Menu PDF"
        >
          <span class="tile__overlay" aria-hidden="true"></span>
          <span class="tile__content">
            <svg class="tile__icon" viewBox="0 0 64 64" fill="none" aria-hidden="true">
              <path d="M24 12h16l-3 24H27L24 12Z" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round"/>
              <path d="M32 36v16" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
              <path d="M24 52h16" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
              <circle cx="42" cy="18" r="5" stroke="currentColor" stroke-width="3"/>
              <path d="M42 23v6" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
            </svg>
            <span class="tile__label">Bar Menu</span>
          </span>
        </a>

        <!-- PDF LINKS — Directory -->
        <a
          class="directory-tile"
          href="Directory.pdf"
          target="_blank"
          rel="noopener"
          aria-label="Open Directory PDF"
        >
          <span class="tile__content">
            <svg class="tile__icon" viewBox="0 0 64 64" fill="none" aria-hidden="true">
              <path d="M12 13c8.5 0 14.5 2.1 20 7.1C37.5 15.1 43.5 13 52 13v35c-8.5 0-14.5 2.1-20 7.1C26.5 50.1 20.5 48 12 48V13Z" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/>
              <path d="M32 20v35" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
            </svg>
            <span class="tile__label">Directory</span>
          </span>
        </a>
      </div>

      <p class="update-note">Scan anytime for the latest updates</p>
    </section>

    <footer class="address-band">
      B-22/B-1,2 Shiv Marg, Collectorate Circle, Banipark, Jaipur-302016
    </footer>
  </main>
</body>
</html>
