<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16302A">
  <title>Meridian House — Guest Documents</title>
  <meta name="description" content="Scan to instantly access the Meridian House restaurant menu, bar menu, and property directory.">
  <link rel="icon" href="data:,">

  <!--
    HOW TO CUSTOMIZE THIS PAGE
    1. Business name  -> edit the <title>, the meta description above, and the <h1 class="business-name"> below.
    2. Logo           -> replace the .logo-placeholder <div> with:
                          <img src="your-logo.png" alt="Your Business Name logo" class="logo-placeholder">
    3. Document links -> update the three href values in the <nav class="links"> section
                          with the real URLs or file paths to your PDFs.
    4. Brand colors   -> adjust the CSS custom properties in :root below.
  -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --ink: #16302A;
      --ink-soft: #56685F;
      --brass: #C7A15A;
      --linen: #FAF7F1;
      --linen-deep: #F1E9D8;
      --paper: #FFFFFF;
      --line: rgba(22, 48, 42, 0.12);
      --radius: 16px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, var(--linen) 0%, var(--linen-deep) 100%);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--ink);
      padding: 40px 20px;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .logo-placeholder {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      border: 1.5px dashed var(--brass);
      background: rgba(199, 161, 90, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }

    .logo-placeholder span {
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      color: var(--ink-soft);
      text-transform: uppercase;
    }

    .business-name {
      font-family: 'Fraunces', Georgia, 'Times New Roman', serif;
      font-weight: 600;
      font-size: clamp(1.6rem, 6vw, 2.15rem);
      letter-spacing: 0.01em;
      color: var(--ink);
      margin-bottom: 10px;
    }

    .tagline {
      font-size: 0.95rem;
      color: var(--ink-soft);
      letter-spacing: 0.01em;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      margin: 30px 0 26px;
    }

    .divider span {
      flex: 1;
      height: 1px;
      background: var(--line);
    }

    .divider i {
      width: 6px;
      height: 6px;
      background: var(--brass);
      transform: rotate(45deg);
      flex-shrink: 0;
    }

    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .doc-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 18px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      text-decoration: none;
      color: var(--ink);
      box-shadow: 0 2px 8px rgba(22, 48, 42, 0.06);
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .doc-btn .icon {
      width: 42px;
      height: 42px;
      border-radius: 11px;
      background: rgba(22, 48, 42, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--ink);
    }

    .doc-btn .icon svg {
      width: 20px;
      height: 20px;
    }

    .doc-btn .label {
      flex: 1;
      text-align: left;
      font-weight: 600;
      font-size: 1.05rem;
    }

    .doc-btn .arrow {
      flex-shrink: 0;
      color: var(--brass);
      display: flex;
      transition: transform 0.18s ease;
    }

    .doc-btn .arrow svg {
      width: 18px;
      height: 18px;
    }

    .doc-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(22, 48, 42, 0.14);
      border-color: var(--brass);
    }

    .doc-btn:hover .arrow {
      transform: translateX(4px);
    }

    .doc-btn:active {
      transform: translateY(0) scale(0.98);
    }

    .doc-btn:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 3px;
    }

    .footer-note {
      margin-top: 30px;
      font-size: 0.78rem;
      letter-spacing: 0.02em;
      color: var(--ink-soft);
    }

    @media (prefers-reduced-motion: reduce) {
      .doc-btn, .doc-btn .arrow {
        transition: none;
      }
    }

    @media (max-width: 360px) {
      .doc-btn .label {
        font-size: 0.98rem;
      }
    }
  </style>
</head>
<body>
  <main class="page">

    <!-- Logo placeholder — replace with: <img src="your-logo.png" alt="Meridian House logo" class="logo-placeholder"> -->
    <div class="logo-placeholder" role="img" aria-label="Business logo placeholder">
      <span>Logo</span>
    </div>

    <h1 class="business-name">Meridian House</h1>
    <p class="tagline">Access our documents instantly</p>

    <div class="divider" aria-hidden="true">
      <span></span><i></i><span></span>
    </div>

    <nav class="links" aria-label="Guest documents">

      <a class="doc-btn" href="https://drive.google.com/uc?export=view&id=1r1SaSm47MzCzc4_wg7xENm-xNJn8O_Ee" target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <line x1="6" y1="3" x2="6" y2="10"/>
            <line x1="9" y1="3" x2="9" y2="10"/>
            <line x1="6" y1="10" x2="9" y2="10"/>
            <line x1="7.5" y1="10" x2="7.5" y2="21"/>
            <polygon points="15,3 19,3 17,10" fill="currentColor" stroke="none"/>
            <line x1="17" y1="10" x2="17" y2="21"/>
          </svg>
        </span>
        <span class="label">Restaurant Menu</span>
        <span class="arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 6l6 6-6 6"/>
          </svg>
        </span>
      </a>

      <a class="doc-btn" href="https://drive.google.com/uc?export=view&id=1QbZlfEkeitp7ZYUIM4beLdSUs38UMf2T" target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="4,4 20,4 12,14"/>
            <line x1="12" y1="14" x2="12" y2="21"/>
            <line x1="8" y1="21" x2="16" y2="21"/>
          </svg>
        </span>
        <span class="label">Bar Menu</span>
        <span class="arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 6l6 6-6 6"/>
          </svg>
        </span>
      </a>

      <a class="doc-btn" href="<a class="doc-btn" href="https://drive.google.com/uc?export=view&id=12KoqzFs555WuBNmM79XTkkSnoqNFKeoK" target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/>
            <polygon points="15,8 13,13 8,15 10,10" fill="currentColor" stroke="none"/>
          </svg>
        </span>
        <span class="label">Directory</span>
        <span class="arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 6l6 6-6 6"/>
          </svg>
        </span>
      </a>

    </nav>

    <p class="footer-note">Scan anytime for the latest updates</p>

  </main>
</body>
</html>
