<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hotel Golden Manor Documents</title>
  <style>
    :root {
      --page-bg: #fff4d8;
      --panel-bg: #ffffff;
      --gold: #9b813b;
      --deep-brown: #2a1f18;
      --shadow: 0 18px 28px rgba(56, 42, 28, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--page-bg);
      font-family: Arial, Helvetica, sans-serif;
      color: #000;
    }

    body {
      display: flex;
      justify-content: center;
    }

    .poster {
      width: 600px;
      min-height: 1050px;
      background: var(--page-bg);
      position: relative;
      overflow: hidden;
    }

    .main-card {
      width: 546px;
      margin: 121px auto 0;
      background: var(--panel-bg);
      text-align: center;
      padding: 88px 31px 0;
      min-height: 715px;
      position: relative;
    }

    .logo {
      position: absolute;
      top: -72px;
      left: 50%;
      width: 96px;
      height: 153px;
      transform: translateX(-50%);
      object-fit: cover;
      display: block;
    }

    h1 {
      margin: 0 0 24px;
      font-size: 46px;
      line-height: 1.06;
      letter-spacing: 0;
      font-weight: 800;
    }

    .contact {
      margin: 0;
      color: var(--gold);
      font-size: 15px;
      line-height: 1.75;
      font-weight: 800;
    }

    .document-grid {
      margin-top: 22px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 23px 22px;
      align-items: stretch;
    }

    .tile {
      display: block;
      border-radius: 8px;
      text-decoration: none;
      overflow: hidden;
      background-repeat: no-repeat;
      background-position: center;
      background-size: cover;
    }

    .tile:focus-visible {
      outline: 4px solid rgba(155, 129, 59, 0.45);
      outline-offset: 4px;
    }

      line-height: 1.45;
      font-weight: 800;

      .directory-tile {
        height: 165px;
